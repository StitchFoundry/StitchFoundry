# StitchFoundry's checks: on every push to main and every pull request, the gate contributors run
# before committing, `cargo xtask ci` (fmt, clippy -D warnings, tests, assets, brands, layers,
# wasm). The other workflows in this folder are VectorCraft's and only run in its repository.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info, so target/ fits the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: cargo xtask ci
    # Drafts skip (a skipped job reports success to branch protection); ready_for_review starts the run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Docs-only PRs (only *.md or progress/ changed) skip the heavy steps below. The job always starts, so the
      # required check still reports. A failed diff fails this step: it never silently skips the checks.
      - name: Detect docs-only change
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          code=true
          if [ "$EVENT" = pull_request ]; then
            changed=$(git diff --name-only "$BASE_SHA"...HEAD)
            if [ -n "$changed" ]; then
              other=$(printf '%s\n' "$changed" | grep -cvE '(\.md$|^progress/)' || true)
              if [ "$other" = 0 ]; then code=false; fi
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code changed: $code"
      - name: Free disk space
        if: steps.scope.outputs.code == 'true'
        # The workspace's build outputs need more room than the runner leaves free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install build dependencies
        if: steps.scope.outputs.code == 'true'
        run: |
          # Fallback mirror + retries: the Azure Ubuntu mirror had DNS outages (2026-11-11).
          # Ubuntu-host DNS outage 2026-11-11: try mirrors.kernel.org (not on ubuntu.com) first, then the Azure mirror.
          printf "http://mirrors.kernel.org/ubuntu/\nhttp://azure.archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i -E "s#https?://(security|archive|azure\.archive)\.ubuntu\.com/ubuntu#http://mirrors.kernel.org/ubuntu#g" /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 20; done
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      # The toolchain the code is checked with locally. Each Rust release adds clippy lints, so
      # bump it on purpose and fix what the new lints flag in the same commit.
      - uses: dtolnay/rust-toolchain@master
        if: steps.scope.outputs.code == 'true'
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.code == 'true'
        with:
          key: ci
      - name: cargo xtask ci
        if: steps.scope.outputs.code == 'true'
        run: cargo xtask ci
      - name: Disk left
        if: always() && steps.scope.outputs.code == 'true'
        run: df -h /
