# AI test jobs (AI-EVAL-01, evals/ai/README.md): run by hand only. Design from Prompt draws each job
# in evals/ai/jobs from its description with the repository's ANTHROPIC_API_KEY secret (billed to
# that Anthropic account), and the report (stitches, tokens, cost, time) is kept as an artifact for
# 30 days. The owner's reference photos are never here: compare the report with them locally.
# `pictures` also has other image models paint each job (google, openai, grok, or
# openrouter:MODEL for any model OpenRouter offers, with the GOOGLE_API_KEY, OPENAI_API_KEY,
# GROK_API_KEY or OPENROUTER_API_KEY secret, billed to that account) and Claude redraw it as
# stitches.
name: AI test jobs

on:
  workflow_dispatch:
    inputs:
      effort:
        description: "quick, normal, thorough (comma-separated) or all"
        default: all
      only:
        description: "job ids to run (comma-separated); empty: every job"
        default: ""
      pictures:
        description: "picture services to compare too (google, openai, grok, openrouter:MODEL; comma-separated); empty: Claude alone"
        default: ""

permissions:
  contents: read

concurrency:
  group: ai-eval
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  ai-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          # Ubuntu-host DNS outage 2026-11-11: on GitHub's x64 Ubuntu runners, try mirrors.kernel.org first, then Azure.
          if [ -f /etc/apt/apt-mirrors.txt ] && [ "$(dpkg --print-architecture)" = amd64 ]; then
            printf "http://mirrors.kernel.org/ubuntu/\nhttp://azure.archive.ubuntu.com/ubuntu/\n" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            sudo sed -i -E "s#https?://(security|archive|azure\.archive)\.ubuntu\.com/ubuntu#http://mirrors.kernel.org/ubuntu#g" /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
          fi
          for i in 1 2 3; do sudo apt-get -o Acquire::Retries=3 update && break; sleep 20; done
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: ai-eval
      - name: Build stitchfoundry-cli
        run: cargo build -p vectorcraft-cli
      - name: Run the jobs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EFFORT: ${{ inputs.effort }}
          ONLY: ${{ inputs.only }}
          PICTURES: ${{ inputs.pictures }}
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The repository has no ANTHROPIC_API_KEY secret (Settings › Secrets and variables › Actions): nothing was sent."
            exit 1
          fi
          args=(--effort "$EFFORT" --out target/ai-eval/report --yes)
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          if [ -n "$PICTURES" ]; then args+=(--pictures "$PICTURES"); fi
          target/debug/stitchfoundry-cli ai-eval "${args[@]}" 2>&1 | tee target/ai-eval-log.txt
      - name: Summary
        if: always()
        run: |
          {
            echo '## AI test jobs'
            echo '```'
            cat target/ai-eval-log.txt 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-eval-report
          path: target/ai-eval/report
          retention-days: 30
          if-no-files-found: warn
